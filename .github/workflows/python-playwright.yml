name: FlowSense Python Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm install

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-playwright.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: python -m pytest tests_python -q --browser ${{ matrix.browser }} --html=artifacts/python-report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowsense-playwright-${{ matrix.browser }}
          path: |
            artifacts/
            backend.log
            frontend.log
